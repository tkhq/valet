name: CI

on:
  push:
    branches: [main, dev-v2]
    tags: ["v*", "valet/v*"]
  # Manual Docker and CLI publishing uses the same checks as branch and release pushes.
  workflow_dispatch:
  # Deliberately unfiltered. A pull_request branches filter matches the PR's
  # base, so pinning it to main/dev-v2 skipped every stacked PR that targets
  # another feature branch, and those PRs showed no CI at all until they were
  # retargeted. The trigger only fires for open PRs, so leaving it open runs
  # each PR once against whatever branch it currently targets.
  pull_request:

# Cancel superseded PR validation; publishing pushes must finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml

  # Keep the existing branch-protection check name.
  ci:
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Report
        run: test "${{ needs.checks.result }}" = "success"

  # A dev-v2 push publishes only while its commit is still the branch head.
  # The publish workflows cancel an in-progress publish of the same ref, and
  # an older commit whose tests finish later would otherwise cancel the newer
  # commit's publish and leave the head with no images. If the read fails,
  # this job fails and nothing publishes.
  tip:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-v2'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Compare with the branch head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_SHA} is no longer the head of ${GITHUB_REF_NAME} (${head}). The publish is skipped; the newer commit publishes its own images."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  # The aggregate check includes every required test shard and lint job.
  # `tip` is skipped for tags and manual runs, so the default success()
  # condition would skip them too. The explicit `!cancelled()` and
  # `needs.ci.result == 'success'` keep failed or cancelled CI from publishing.
  publish:
    needs: [ci, tip]
    if: ${{ !cancelled() && needs.ci.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/valet/v') || (github.ref == 'refs/heads/dev-v2' && needs.tip.outputs.current == 'true')))) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

  publish-cli:
    needs: [ci, tip]
    if: ${{ !cancelled() && needs.ci.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/valet/v') || (github.ref == 'refs/heads/dev-v2' && needs.tip.outputs.current == 'true')))) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-cli.yml
    secrets: inherit
