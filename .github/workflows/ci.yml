name: CI

on:
  push:
    branches: [main, dev-v2]
    tags: ["v*", "valet/v*"]
  # Manual Docker and CLI publishing uses the same checks as branch and release pushes.
  workflow_dispatch:
  # Deliberately unfiltered. A pull_request branches filter matches the PR's
  # base, so pinning it to main/dev-v2 skipped every stacked PR that targets
  # another feature branch, and those PRs showed no CI at all until they were
  # retargeted. The trigger only fires for open PRs, so leaving it open runs
  # each PR once against whatever branch it currently targets.
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml

  # Keep the existing branch-protection check name.
  ci:
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Report
        run: test "${{ needs.checks.result }}" = "success"

  # The aggregate check includes every required test shard and lint job.
  # Keep the default success() condition so failed or cancelled CI cannot publish.
  publish:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/dev-v2' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/valet/v')))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit

  publish-cli:
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/dev-v2' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/valet/v')))
    permissions:
      contents: write
    uses: ./.github/workflows/release-cli.yml
    secrets: inherit
