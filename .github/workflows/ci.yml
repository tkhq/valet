name: CI

on:
  push:
    branches: [main, dev-v2]
  # Deliberately unfiltered. A pull_request branches filter matches the PR's
  # base, so pinning it to main/dev-v2 skipped every stacked PR that targets
  # another feature branch, and those PRs showed no CI at all until they were
  # retargeted. The trigger only fires for open PRs, so leaving it open runs
  # each PR once against whatever branch it currently targets.
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - run: pnpm install --frozen-lockfile

      - name: Generate plugin registries
        run: cd packages/worker && bun scripts/generate-plugin-registry.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck client
        run: cd packages/client && npx tsc --noEmit

      - name: Test
        run: pnpm test
