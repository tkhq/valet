name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install bun via the official curl script rather than the
      # oven-sh/setup-bun action. The action fetches release metadata
      # from api.github.com, which means every CI run inherits GitHub
      # API's availability — and when the API 503s (as it did on the
      # 2026-07-16 outage), every job fails in setup at ~10s with a
      # zero code change. The curl script downloads bun directly from
      # bun.sh and only touches api.github.com at all if you pin
      # BUN_INSTALL_VERSION to `latest` — we pin an explicit version so
      # nothing outside bun.sh is required for CI to start.
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.1.42"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - name: Generate plugin registries
        run: cd packages/worker && bun scripts/generate-plugin-registry.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck client
        run: cd packages/client && npx tsc --noEmit

      - name: Build client
        run: cd packages/client && pnpm build

      - name: Test
        run: pnpm test
