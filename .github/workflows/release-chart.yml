name: Release Helm Chart

on:
  push:
    branches: [dev-v2]
    paths:
      - "deploy/chart/valet/**"
      - ".github/workflows/release-chart.yml"
  workflow_dispatch:

permissions:
  contents: write  # push git tag
  packages: write  # push OCI artifact to GHCR

env:
  CHART_DIR: deploy/chart/valet
  # Lowercased owner — GHCR OCI paths must be lowercase.
  REGISTRY: ghcr.io/tkhq/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for the collision check + tagging

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Read chart version
        id: chart
        run: |
          set -euo pipefail
          name=$(yq -r .name "$CHART_DIR/Chart.yaml")
          version=$(yq -r .version "$CHART_DIR/Chart.yaml")
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Chart.yaml is missing 'version'" >&2
            exit 1
          fi
          # Enforce strict semver (X.Y.Z or X.Y.Z-prerelease).
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Chart version '$version' is not valid semver" >&2
            exit 1
          fi
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=chart/$name-v$version" >> "$GITHUB_OUTPUT"

      - name: Lint + template
        run: |
          helm lint "$CHART_DIR"
          helm template "$CHART_DIR" >/dev/null

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check version not already published
        id: check
        run: |
          set +e
          helm show chart "oci://$REGISTRY/${{ steps.chart.outputs.name }}" \
            --version "${{ steps.chart.outputs.version }}" >/dev/null 2>&1
          exists=$?
          set -e
          if [[ $exists -eq 0 ]]; then
            echo "::error::Chart ${{ steps.chart.outputs.name }} version ${{ steps.chart.outputs.version }} is already published. Bump 'version' in $CHART_DIR/Chart.yaml."
            exit 1
          fi

      - name: Package + push
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          helm package "$CHART_DIR" --destination "$out"
          helm push "$out/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" "oci://$REGISTRY"

      - name: Tag release
        run: |
          set -euo pipefail
          tag="${{ steps.chart.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists, skipping"
            exit 0
          fi
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "\`oci://$REGISTRY/${{ steps.chart.outputs.name }}:${{ steps.chart.outputs.version }}\`"
            echo ""
            echo "Consume from Terraform:"
            echo '```hcl'
            echo 'helm_release.valet:'
            echo '  repository = "oci://'"$REGISTRY"'"'
            echo '  chart      = "${{ steps.chart.outputs.name }}"'
            echo '  version    = "${{ steps.chart.outputs.version }}"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
