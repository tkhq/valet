# Tears down the per-PR environment stamped by deploy-pr-env.yml.
#
# Runs when a `preview-env`-labeled PR closes, or when the label is removed
# from an open PR. Teardown is mandatory: every per-PR worker runs the
# minutely cron from wrangler.toml, so a leaked env keeps billing forever.
name: Destroy PR Environment

on:
  pull_request:
    types: [closed, unlabeled]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

# Shares the deploy workflow's group so an in-flight deploy is cancelled
# before its resources are deleted out from under it.
concurrency:
  group: pr-env-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  destroy:
    name: Destroy full-stack PR environment
    runs-on: ubuntu-latest
    environment: dev
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview-env')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview-env'))

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler is a devDependency of packages/worker — no separate install needed.
      - run: echo "$GITHUB_WORKSPACE/packages/worker/node_modules/.bin" >> $GITHUB_PATH

      - name: Create deploy config
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > .env.deploy.pr <<EOF
          PROJECT_NAME=valet-pr-${PR_NUMBER}
          EOF

      - name: Destroy PR environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ENVIRONMENT=pr make destroy-pr-env

      - name: Update PR environment comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-env -->';
            const body = [
              marker,
              '**PR environment** (`preview-env` label)',
              '',
              'Environment `valet-pr-${{ github.event.pull_request.number }}` has been destroyed (PR closed or label removed).',
              'Re-add the `preview-env` label to stamp a fresh one.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
