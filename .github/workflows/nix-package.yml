name: Nix package

# Checks the Nix package for the Valet CLI (flake.nix, nix/valet.nix).
# The Bun release binary stays dynamically linked. The package runs it in an
# FHS environment (x86_64-linux only; arm64 is not offered until a release with a
# working linux-arm64 binary exists) so it works on NixOS without programs.nix-ld. This workflow
# does not build or change the release binaries (see release-cli.yml).
#
# The pull_request trigger is deliberately unfiltered by base branch, like ci.yml.
on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/nix-package.yml
  push:
    branches: [dev-v2]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/nix-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Ubuntu 24.04 blocks unprivileged user namespaces by default. The FHS
      # wrapper (bubblewrap) needs them, as it does on NixOS.
      - name: Allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Flake check
        run: nix flake check

      - name: Build package
        run: |
          nix build .#valet --print-build-logs
          nix build .#valet-unwrapped --out-link result-unwrapped
          nix build .#valet-signal-probe --out-link result-probe

      # The release binary is not modified: same dynamic ELF, same loader path.
      # This documents that the package is not a static executable.
      - name: Show ELF interpreter of the packaged binary
        run: |
          nix shell nixpkgs#binutils -c readelf -l result-unwrapped/bin/valet | grep 'Requesting program interpreter'

      - name: Run packaged valet --help
        run: ./result/bin/valet --help

      # Simulate NixOS: a root that has only /nix, no /lib64 or /lib.
      # The raw release binary must fail there. The package must work.
      - name: Run in a root with only /nix
        run: |
          set -euo pipefail
          BWRAP="$(nix build nixpkgs#bubblewrap --no-link --print-out-paths)/bin/bwrap"
          NIXROOT=("$BWRAP" --unshare-user --ro-bind /nix /nix --proc /proc --dev /dev --tmpfs /tmp --dir /etc --setenv TMPDIR /tmp)
          raw="$(readlink -f result-unwrapped/bin/valet)"
          pkg="$(readlink -f result/bin/valet)"
          if "${NIXROOT[@]}" "$raw" --help >/dev/null 2>&1; then
            echo "raw release binary ran without a loader; the simulation is invalid" >&2
            exit 1
          fi
          echo "raw release binary fails without /lib64, as on NixOS"
          "${NIXROOT[@]}" "$pkg" --help

      # The wrapper is a bubblewrap launcher. This checks, through the wrapper:
      # SIGTERM and SIGKILL cleanup of `valet serve`, terminal-style SIGINT and
      # SIGQUIT (not ignored), stdin, arguments, exit status, and no leftover
      # process after a SIGKILL at any point of startup.
      - name: Signal handling through the wrapper
        run: nix/test-signals.sh result/bin/valet result-probe/bin/valet
