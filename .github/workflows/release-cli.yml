name: Release CLI

# Builds self-contained native `valet` binaries on a version tag.
#
# Each binary is one file (Bun `--compile`) with the whole product embedded:
# the esbuild server bundle plus an archive of PGlite's wasm/data and the web
# SPA (extracted to a content-hashed temp dir at first run). No Node, no sibling
# assets — `./valet serve` and browse. See docs/plans/2026-07-18-native-binary-
# bun-compile.md and the spec Deviations.
#
# Platforms: macOS arm64 (native runner) + macOS x64 (cross-compiled), Linux
# x64 (native runner) + Linux arm64 (cross-compiled from the x64 runner).
# Each binary embeds the sharp native packages for its own target. The
# cross-compiled binaries are smoke-tested on native runners. Windows = WSL (run the
# linux-x64 binary).
#
# macOS Gatekeeper: compile-binary.mjs re-signs the binaries ad-hoc and
# verifies the signature (Bun's own signature is invalid). They are not
# Developer-ID-signed/notarized. A BROWSER download gets quarantined and
# macOS shows a misleading "binary is damaged" dialog; `curl` downloads
# carry no quarantine flag and just run. Both release bodies carry the
# `xattr -d com.apple.quarantine` escape hatch. Real notarization needs an
# Apple Developer cert wired into this workflow (not done).
#
# CI gates every publish path. Use CI's Run workflow button for manual builds.
# Publish paths:
#   - tag push (valet/v*): versioned GitHub Release with all binaries attached.
#   - merge to dev-v2: the same binaries replace the assets of a single
#     rolling prerelease tagged `dev-v2-latest`, so the download URLs
#     (…/releases/download/dev-v2-latest/valet-<os>-<arch>) stay stable.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Application tag at the caller commit
        required: false
        default: ''
        type: string

env:
  BUILD_REF: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  BUILD_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write # create the GitHub Release + upload assets

# CI can finish out of commit order. Different source commits must not cancel
# each other's builds; tag releases keep their shared tag group.
concurrency:
  group: release-cli-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || (startsWith(github.ref, 'refs/heads/') && format('{0}-{1}', github.ref, github.sha) || github.ref) }}
  cancel-in-progress: ${{ inputs.release_tag == '' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  binaries:
    env:
      # The macOS runner exhausted Node's default heap during workspace builds.
      # Leave room for native allocations and the OS on the 7 GB runner.
      NODE_OPTIONS: --max-old-space-size=4096
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            # GitHub retired the macos-14 image. Its jobs are cancelled before
            # any step runs, and publish is then skipped.
            # darwin-x64 (Intel Macs) is cross-compiled from the arm64
            # runner and smoke-tested by the smoke-cross job below.
            targets: bun-darwin-arm64 bun-darwin-x64
            smoke: valet-darwin-arm64
          - runner: ubuntu-latest
            targets: bun-linux-x64 bun-linux-arm64
            smoke: valet-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          # Pin the Bun the arc's compile/WS/PGlite gates were verified against.
          # TODO(2026-10-20 eMudhra CA compromise, https://emudhra.we-have-a-problem.com/):
          # the compiled `valet` binary still trusts the compromised "emSign ECC
          # Root CA - G3" via Bun's bundled root store. Bun's `fetch` ignores
          # --use-system-ca, --use-openssl-ca, NODE_USE_SYSTEM_CA, SSL_CERT_FILE and
          # --compile-exec-argv (tested on Bun 1.4.3). Bump this pin to the first
          # Bun release that ships the distrust, then remove this TODO.
          bun-version: 1.2.17

      - run: pnpm install --frozen-lockfile

      - name: Generate changelog artifact
        run: |
          set -euo pipefail
          build_sha=$(git rev-parse HEAD)
          common=(
            --backfill-tags 'valet/v*'
            --artifact-sha "$build_sha"
            --metadata packages/api/src/changelog/release.json
          )
          if [[ "$BUILD_REF" == refs/tags/v* ]]; then
            version="${BUILD_TAG#valet/}"
            node packages/api/scripts/generate-changelog.mjs \
              "${common[@]}" \
              --artifact-version "${version#v}"
          else
            node packages/api/scripts/generate-changelog.mjs \
              "${common[@]}" \
              --unreleased-sha "$build_sha" \
              --built-at "$(git show -s --format=%cI "$build_sha")" \
              --build-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --artifact-version Unreleased
          fi

      # registry.gen.ts is committed, but regenerate so a tag always reflects
      # the current plugin set.
      - name: Generate plugin registries
        run: make generate-registries

      # Required CI already typechecks this commit. Emit the workspace graph
      # for packaging without repeating its semantic checks on each platform.
      - name: Emit workspace packages
        run: pnpm exec tsc --build --noCheck

      - name: Build web SPA
        run: pnpm --filter @valet/web build

      - name: Build server bundle + staged assets
        env:
          VALET_SHARP_STAGE: all
        run: |
          pnpm --filter @valet/api run build:assets
          pnpm --filter @valet/api run build:bundle

      - name: Compile native binaries
        run: |
          set -euo pipefail
          for t in ${{ matrix.targets }}; do
            node packages/api/build/compile-binary.mjs --target "$t"
          done
          ls -la packages/api/dist/valet-*-* | grep -v '\.mjs'

      # Smoke only the binary that matches this runner's platform (a cross-built
      # binary can't run here). Boot it fully self-contained and hit health.
      - name: Smoke test (native target)
        run: scripts/smoke-binary.sh "packages/api/dist/${{ matrix.smoke }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valet-binaries-${{ matrix.runner }}
          path: packages/api/dist/valet-*-*
          if-no-files-found: error

  # Cross-compiled binaries cannot run on the runner that built them. Run each
  # one on a native runner of its own platform before anything is published.
  smoke-cross:
    needs: binaries
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            artifact: valet-binaries-ubuntu-latest
            bin: valet-linux-arm64
          - runner: macos-15-intel
            artifact: valet-binaries-macos-15
            bin: valet-darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/valet-bin

      - name: Smoke test (cross-compiled target)
        run: |
          chmod +x "/tmp/valet-bin/${{ matrix.bin }}"
          scripts/smoke-binary.sh "/tmp/valet-bin/${{ matrix.bin }}"

  # Publish only after both platform builds and all smoke tests succeed.
  publish:
    needs: [binaries, smoke-cross]
    runs-on: ubuntu-latest
    # Hold one lock from the remote-head check through the asset upload.
    # Queue all waiting jobs so a late older build cannot replace a pending tip.
    concurrency:
      group: release-cli-publish-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/valet-binaries
          pattern: valet-binaries-*
          merge-multiple: true

      # Reusable calls upload assets without replacing the application release notes.
      - name: Attach application release binaries
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" /tmp/valet-binaries/valet-*-* --clobber

      - name: Publish to GitHub Release
        if: inputs.release_tag == '' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/valet-binaries/valet-*-*
          fail_on_unmatched_files: true
          # Pre-release-suffixed tags (v0.2.0-rc.1) are marked prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Valet native single-file CLI (`${{ github.ref_name }}`).

            Download the binary for your platform, `chmod +x`, and run
            `./valet-<os>-<arch> serve` — no Node, no install. `valet chat`,
            `valet send --json …`, `valet login <url>` all work from the same
            file. Windows: run the linux-x64 binary under WSL.

            **macOS:** if you downloaded with a browser, Gatekeeper shows a
            bogus "binary is damaged" dialog (the binaries are not notarized).
            Clear the quarantine flag — or download with `curl -LO`, which
            never sets it:

            ```
            xattr -d com.apple.quarantine ./valet-darwin-<arch>
            ```

      # Rolling prerelease on dev-v2 merges: fixed tag, same-named assets are
      # replaced in place, so download URLs are stable across merges. The
      # release's "source code" links point at whatever commit first created
      # the tag — the body carries the actual SHA.
      - name: Check rolling release source
        id: rolling
        if: ${{ inputs.release_tag == '' && github.ref == 'refs/heads/dev-v2' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev-v2" --jq '.object.sha')
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping rolling release: $GITHUB_SHA is not current dev-v2 head $head_sha."
          fi

      - name: Publish rolling dev-v2 prerelease
        if: ${{ inputs.release_tag == '' && github.ref == 'refs/heads/dev-v2' && steps.rolling.outputs.current == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-v2-latest
          name: dev-v2 rolling build
          prerelease: true
          files: /tmp/valet-binaries/valet-*-*
          fail_on_unmatched_files: true
          body: |
            Rolling native `valet` binaries from the latest merge to `dev-v2`
            (currently `${{ github.sha }}`). Assets are replaced on every
            merge — this is not a versioned release.

            Download the binary for your platform, `chmod +x`, and run
            `./valet-<os>-<arch> serve`. Windows: run the linux-x64 binary
            under WSL.

            **macOS:** if you downloaded with a browser, Gatekeeper shows a
            bogus "binary is damaged" dialog (the binaries are not notarized).
            Clear the quarantine flag — or download with `curl -LO`, which
            never sets it:

            ```
            xattr -d com.apple.quarantine ./valet-darwin-<arch>
            ```
