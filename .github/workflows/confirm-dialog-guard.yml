name: Confirm dialog guard

# A separate workflow, like the schema repair guard, so a web-only invariant
# fails on its own without re-running typecheck and the test shards. The
# default pull_request types are enough: the check reads the tree, not the PR
# body, so there is nothing for `edited` to re-check. The trigger is
# deliberately unfiltered by base branch, so stacked PRs are checked too.
on:
  pull_request:

jobs:
  confirm-dialog:
    runs-on: ubuntu-latest
    steps:
      # A shallow checkout is enough. The guard scans the whole tree at HEAD
      # rather than the PR's diff, so it needs no base commit.
      - uses: actions/checkout@v4

      - name: A destructive action must use the ConfirmDialog primitive
        run: python3 scripts/ci/confirm_dialog_guard.py
