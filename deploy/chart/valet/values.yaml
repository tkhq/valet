# Default values for the valet chart.
# See deploy/chart/valet/README.md for install ordering (agent-sandbox CRDs
# +controller must be installed BEFORE this chart).

api:
  # The engine is a stateful singleton (in-memory submission claim loop,
  # WS fan-out) — do NOT scale this beyond 1 replica. There is no leader
  # election or shared engine state across pods.
  replicas: 1

  # Defaults target the local reference env (`make k8s-build` images, visible
  # to k3s via Rancher Desktop moby mode). CI publishes multi-arch images to
  # GHCR on every dev-v2 merge (.github/workflows/docker-publish.yml) — for a
  # remote cluster, point at those and pin the immutable sha tag:
  #   repository: ghcr.io/<owner>/valet-api
  #   tag: sha-<shortsha>
  # (The moving `dev-v2` tag + `pullPolicy: IfNotPresent` is a stale-image
  # trap: a node that already has the tag never re-pulls.)
  image:
    repository: valet-api
    tag: dev
    pullPolicy: IfNotPresent

  # Names of existing `kubernetes.io/dockerconfigjson` Secrets (in the
  # release namespace) for pulling the api image from a private registry.
  # Unneeded for the public GHCR images.
  imagePullSecrets: []

  port: 8787

  resources: {}

  # Non-secret env, merged into the api ConfigMap.
  # BETTER_AUTH_URL must be https:// — better-auth marks session cookies
  # Secure, so plain http breaks login once TLS terminates at the ingress.
  betterAuthUrl: "https://valet.localdev"

  # Optional social/SSO env (non-secret half — client IDs, issuer, domain).
  # Secret halves (client secrets) live under api.secrets below.
  auth:
    oidcIssuer: ""
    oidcClientId: ""
    oidcName: ""
    oidcDomain: ""
    googleClientId: ""
    githubClientId: ""
    trustedOrigins: ""
    allowedEmailDomains: ""

  # Optional pre-existing GitHub App (non-secret half — the `GITHUB_APP_*`
  # env fallback). Set these three plus the api.secrets.githubApp* values
  # to make the deployment GitHub-capable without running the in-app
  # manifest flow. Nothing is written to the database; the env is the
  # config. An org that later completes the manifest flow shadows this.
  # The app's webhook URL must point at
  # {public URL}/webhooks/github-app. See
  # docs/specs/2026-07-16-github-repo-integration-design.md.
  githubApp:
    appId: ""
    slug: ""
    clientId: ""

  # Secret values. Leave blank to have the chart generate-and-retain them
  # (see templates/secret.yaml's lookup-based retain guard) — regenerating
  # BETTER_AUTH_SECRET on every `helm upgrade` would invalidate every
  # session AND rotate the sandbox JWT master (VALET_SANDBOX_JWT_MASTER
  # falls back to BETTER_AUTH_SECRET when unset).
  #
  # DO NOT commit real values here — placeholders only.
  secrets:
    betterAuthSecret: ""
    encryptionKey: ""
    anthropicApiKey: ""
    oidcClientSecret: ""
    googleClientSecret: ""
    githubClientSecret: ""
    # Secret half of api.githubApp (the `GITHUB_APP_*` env fallback).
    # githubAppPrivateKey takes the app's PEM, raw or base64-encoded.
    # githubAppWebhookSecret is optional (leave blank for a webhook-less
    # app). These are never chart-generated — set them, or deliver them
    # via api.extraEnvFrom (e.g. External Secrets Operator).
    githubAppPrivateKey: ""
    githubAppClientSecret: ""
    githubAppWebhookSecret: ""

  # Optional instance config file content (multiline YAML string). Supply via
  # --set-file api.instanceConfig=config/valet.prod.yaml on helm install/upgrade.
  # When set, the chart creates a ConfigMap (<fullname>-instance-config), mounts
  # it at /etc/valet, and sets VALET_CONFIG=/etc/valet/valet.yaml on the api
  # container. Also rolls the Deployment when the content changes (via checksum
  # annotation). Leave blank to disable the ConfigMap and mount entirely.
  instanceConfig: ""

  # Additional envFrom entries appended to the api Deployment. Use this
  # to load env vars from Secrets/ConfigMaps managed outside the chart
  # (e.g. External Secrets Operator syncing from AWS Secrets Manager).
  # Later entries override earlier ones on key collision — leave the
  # matching chart-managed secrets in api.secrets blank to defer to them.
  extraEnvFrom: []
  # - secretRef:
  #     name: valet-external-secrets

serviceAccount:
  # ServiceAccount the api pod runs as. Bound (via RoleBinding, in the
  # sandbox namespace) to the Role granting Sandbox CR + pods/exec/log
  # access — see templates/rbac.yaml.
  name: valet-api
  create: true

sandbox:
  # Namespace where session Sandbox CRs (and their backing pods/PVCs) live.
  # Kept separate from the api's own namespace so the RBAC Role below can
  # stay narrowly scoped instead of granting pod access next to the api
  # pod itself.
  namespace: valet-sandboxes

  # The SINGLE sandbox base image (via an auto-seeded kind='external'
  # source). Every sandbox and every bake chains on it: agent tooling,
  # gateway, ttyd, code-server, rootless docker toolchain, start scripts.
  # Pin to sha-<shortsha> for reproducible deploys.
  fullBaseImage: ghcr.io/tkhq/valet-sandbox:latest

  # RuntimeClass for docker-enabled sandbox pods. Point it at a containerd
  # runtime configured with `cgroup_writable = true` (containerd >= 2.1,
  # systemd cgroup driver) so the in-userns dockerd can create
  # per-container cgroups. Without it the daemon starts but every
  # `docker run` fails: kubelet mounts the pod cgroupfs read-only and the
  # cgroup directory is owned by unmapped host root. The cluster operator
  # must create the RuntimeClass object and the node containerd config;
  # the chart only threads the name through. Empty → field omitted.
  dockerRuntimeClass: ""

  # DEPRECATED. Legacy fallback consulted by unparented sources when nothing
  # else resolves. Kept for one release; will be removed in a future v2.x.
  # image:
  #   repository: ghcr.io/tkhq/valet-sandbox
  #   tag: latest

  # Local-dev default for the DEPRECATED legacy pin above. Remote deploys
  # set `sandbox.image: null` — the ConfigMap then omits
  # VALET_SANDBOX_IMAGE and the api resolves sandboxes through the seeded
  # per-profile base sources instead.
  image:
    # Pull-hosted through the bundled registry (NodePort) so BuildKit base
    # bakes can FROM the stock image via the push-host rewrite, and so the
    # stock ref is content-addressed for reconcile. `make k8s-build` pushes
    # the image here.
    repository: localhost:30500/valet-sandbox
    tag: dev

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  # Extra Ingress metadata.annotations (e.g. cert-manager.io/cluster-issuer
  # on EKS). The traefik router.tls annotation is emitted automatically
  # only when className is "traefik".
  annotations: {}
  host: valet.localdev
  # TLS terminates at Traefik. Leave secretName empty to use Traefik's
  # built-in default (self-signed) certificate — fine for the local
  # reference environment; set a real secretName (from cert-manager or
  # a manually created TLS secret) for anything beyond that.
  tls:
    enabled: true
    secretName: ""

postgres:
  # Bundled single-replica postgres:17 StatefulSet. Set to false (or set
  # externalDatabase.url) to disable it and point the api at managed PG.
  bundled: true
  image:
    repository: postgres
    tag: "17"
  storageClassName: "" # "" = cluster default storage class
  storageSize: 5Gi
  database: valet
  user: valet
  # Blank = chart-generated-with-retain (see templates/postgres-secret.yaml).
  password: ""

externalDatabase:
  # When set, disables the bundled postgres StatefulSet/Service/Secret
  # entirely and the api's DATABASE_URL is this value verbatim.
  url: ""

registry:
  # Bundled single-replica `registry:2` StatefulSet (sandbox images v2 plan,
  # Task 5) — backs the kubernetes ImageBuilder's push target and the
  # kubernetes sandbox provider's pull target for prebuilt images. Set to
  # false (or set externalRegistry.url) to disable it and push/pull against
  # an external registry instead.
  bundled: true
  image:
    repository: registry
    tag: "2"
  storageClassName: "" # "" = cluster default storage class
  storageSize: 10Gi
  # NodePort the bundled registry Service is exposed on. This is the PULL
  # endpoint: sandbox pod image refs use `localhost:<nodePort>`, which kubelet
  # resolves per-node (a ClusterIP-only Service name is NOT resolvable by the
  # node's kubelet). BuildKit + retention push/delete over the in-cluster
  # Service DNS instead (see templates/configmap.yaml's split-host wiring).
  nodePort: 30500
  # Nightly registry-garbage-collect CronJob schedule (cron syntax).
  gcSchedule: "0 3 * * *"

externalRegistry:
  # When set, disables the bundled registry StatefulSet/Service entirely;
  # VALET_PREBUILD_REGISTRY (pull) and VALET_PREBUILD_REGISTRY_PUSH (push) both
  # carry this value verbatim (no push/pull split for an external registry) and
  # VALET_PREBUILD_REGISTRY_INSECURE is NOT set (defaults to pushing/pulling
  # over TLS, standard for a real external registry).
  #
  # RETENTION LIMITATION: prebuild image retention (pruning stale prebuilt
  # images beyond the newest 2 per config) currently wires NO registry
  # credentials. It works against the bundled in-cluster registry, but for an
  # external registry the retention manifest-DELETE would require auth — so
  # retention is SKIPPED (with a logged warning) against an external registry.
  # Stale images accumulate there until credentialed retention lands (a
  # follow-up); prune them out of band for now.
  url: ""
  # Name of an existing `kubernetes.io/dockerconfigjson` Secret (created out
  # of band — this chart does not create it) in `sandbox.namespace`, used as
  # `imagePullSecrets` on sandbox pods that pull a prebuilt image from this
  # registry. Ignored when `url` is unset.
  pullSecret: ""

build:
  # BuildKit Job resource requests/limits (moby/buildkit:rootless container).
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Job.spec.activeDeadlineSeconds — a build stuck past this long is killed
  # and reported failed rather than running forever.
  activeDeadlineSeconds: 1800
  # Soft in-process cap (KubernetesImageBuilder) on simultaneously
  # outstanding BuildKit Jobs; extra builds queue FIFO.
  concurrency: 1

observability:
  # Bundled local observability stack (grafana/otel-lgtm: OTel collector +
  # Tempo + Loki + Mimir + Grafana in one container). The api exports engine
  # traces to it via OTLP (agent turns with usage/cost, submission
  # settlements incl. patch capture, errors, sandbox lifecycle). Storage is
  # ephemeral — a local-reference/debug stack, not a durable telemetry store.
  # Set enabled: false for remote deploys, or leave it off and point
  # otlpEndpoint at an external collector.
  enabled: true
  image:
    repository: grafana/otel-lgtm
    tag: latest
  # Grafana UI NodePort: http://localhost:30300 on the local cluster.
  grafanaNodePort: 30300
  resources: {}
  # When set, the api exports OTLP to this URL instead of the bundled
  # stack's in-cluster Service (useful with enabled: false + an external
  # collector). Must be the HTTP (4318) OTLP endpoint base URL.
  otlpEndpoint: ""

helmTest:
  enabled: true
  image: curlimages/curl:8.11.0
