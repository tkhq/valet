apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valet.fullname" . }}-api
  labels:
    {{- include "valet.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Pinned to 1 — see values.yaml's api.replicas comment. The engine is a
  # stateful singleton (in-memory submission claim loop); do not scale.
  replicas: {{ .Values.api.replicas }}
  # Stop the old API before the new process applies one-way schema repairs.
  # No pod serves traffic between the old pod's exit and the new pod's
  # listener; the README's "Upgrade downtime" section lists what RollingUpdate
  # still needs (leader lock, schema repair Job).
  strategy:
    type: Recreate
    rollingUpdate: null
  progressDeadlineSeconds: {{ .Values.api.progressDeadlineSeconds | default 2100 }}
  selector:
    matchLabels:
      {{- include "valet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        # The api reads its config and secrets through envFrom/secretKeyRef,
        # and Kubernetes injects those once, at pod start. Without these two
        # digests in the pod template, an upgrade that only rotates a key
        # leaves the template byte-identical, the pod is never replaced, and
        # the old key stays live while `helm upgrade --wait` reports success.
        #
        # checksum/secret hashes the supplied values, not the rendered Secret
        # — see `valet.apiSecretChecksum` in _helpers.tpl for why.
        #
        # Limitation: api.extraEnvFrom points at Secrets/ConfigMaps this chart
        # does not render. To rotate one of those, run
        # `kubectl rollout restart deployment/<release>-api`.
        checksum/secret: {{ include "valet.apiSecretChecksum" . }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.api.instanceConfig }}
        checksum/instance-config: {{ .Values.api.instanceConfig | sha256sum }}
        {{- end }}
      labels:
        {{- include "valet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # SIGTERM starts the api's drain: /api/ready goes 503, claim loops stop,
      # requests in flight get up to 10s, then sessions are evicted. The api
      # exits on its own after at most 20s (SHUTDOWN_HARD_EXIT_MS in main.ts),
      # so this grace period must stay above 20.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if and .Values.postgres.bundled (not .Values.externalDatabase.url) }}
      initContainers:
        # Boot runs migrations against DATABASE_URL; without this gate the
        # api crash-loops until the bundled postgres StatefulSet is ready.
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "valet.fullname" . }}-postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres...";
                sleep 2;
              done
          envFrom:
            - secretRef:
                name: {{ include "valet.fullname" . }}-postgres
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "valet.fullname" . }}-config
            - secretRef:
                name: {{ include "valet.fullname" . }}-app
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            # The chart fronts the api with an ingress that overwrites
            # client-supplied X-Forwarded-For, so the api may trust the
            # header as the client IP for per-IP rate limiting (the public
            # artifact read). Never set this on a directly exposed api.
            - name: VALET_TRUST_PROXY
              value: "1"
            # VALET_PG_DATA_DIR is unused once DATABASE_URL is set (main.ts
            # only falls back to it when DATABASE_URL is absent), left
            # documented here rather than set.
            {{- if and .Values.postgres.bundled (not .Values.externalDatabase.url) }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "valet.fullname" . }}-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "valet.fullname" . }}-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "valet.fullname" . }}-postgres
                  key: POSTGRES_DB
            # Composed from the postgres Secret's own keys via Kubernetes'
            # native $(VAR) env interpolation — this is the single source
            # of truth for the password, so it can never drift from what
            # the bundled Postgres StatefulSet was actually given.
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "valet.fullname" . }}-postgres:5432/$(POSTGRES_DB)"
            {{- end }}
            {{- if .Values.api.instanceConfig }}
            - name: VALET_CONFIG
              value: /etc/valet/valet.yaml
            {{- end }}
          {{- if .Values.api.instanceConfig }}
          volumeMounts:
            # subPath mounts the single valet.yaml file, not the directory —
            # a directory mount at /etc/valet would shadow anything else the
            # image places there.
            - name: instance-config
              mountPath: /etc/valet/valet.yaml
              subPath: valet.yaml
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # Probe split (boot-ordering fix, chart 0.10.2; drain fix 0.10.32):
          #
          # The api binds a boot listener before database upgrades. It
          # answers every path, /api/health included, with 503 + Retry-After.
          # The real app takes the port once providers are built. From then
          # on /api/health is 200 while the process is up. /api/ready stays
          # 503 until the boot chain's traffic-protecting steps (session
          # restore, config reconcile) finish, and goes 503 again on SIGTERM.
          #
          # Startup uses /api/health, so its budget covers database upgrades.
          # Readiness uses /api/ready. Under Recreate there is no old pod to
          # serve traffic during a rollout: the old pod stops first. The
          # Service publishes not-ready addresses (service.yaml), so callers
          # reach this pod during boot and drain and get its 503 + Retry-After.
          #
          # Startup and readiness poll every second. failureThreshold for
          # startup stays in 5-second units (values.yaml), so it is scaled by 5.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 1
            failureThreshold: {{ mul 5 ((.Values.api.startupProbe | default dict).failureThreshold | default 360) }}
          # After the boot chain, a readiness failure means a stalled event
          # loop. 15 x 1s keeps the earlier 15s tolerance.
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 1
            failureThreshold: 15
          # Liveness shares the event loop with request handling. A busy loop
          # must not kill the only replica: 6 misses of a 5s timeout at a 10s
          # period means the loop answered nothing for about a minute.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      {{- if .Values.api.instanceConfig }}
      volumes:
        - name: instance-config
          configMap:
            name: {{ include "valet.fullname" . }}-instance-config
      {{- end }}
