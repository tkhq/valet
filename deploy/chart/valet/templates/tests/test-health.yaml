{{- if .Values.helmTest.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "valet.fullname" . }}-test-health
  labels:
    {{- include "valet.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: {{ .Values.helmTest.image }}
      command:
        - sh
        - -c
        - |
          set -e
          curl -sf "http://{{ include "valet.fullname" . }}-api:{{ .Values.service.port }}/api/health"
{{- end }}
