{{- if .Values.sandbox.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "valet.labels" . | nindent 4 }}
---
{{- end }}
# Namespaced Role only — deliberately NO cluster-scoped permissions. The
# agent-sandbox controller owns PVC LIFECYCLE (create/delete, via owner
# references to the Sandbox CR); the api's only PVC verbs are the get/patch
# pair the on-demand workspace-growth path needs (see the rule below). Past
# that, the api touches the Sandbox CR itself plus the pod surface
# (exec/log) for command execution and file ops.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "valet.fullname" . }}-sandbox-operator
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "valet.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    # `update` is required by the create-is-upsert adopt path: on a 409 the
    # provider re-asserts the CR via replaceNamespacedCustomObject (HTTP PUT),
    # which is the `update` verb — this is the workspace-preserving
    # re-provision path (decision 5), so omitting it 403s exactly there.
    # `patch` is required by hibernation: suspend/resume flip
    # spec.operatingMode via a JSON merge patch (setOperatingMode) — omitting
    # it 403s the idle sweep and the pause route.
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # The controller creates pods. The api reads them, resolves Job pods by
    # label, and deletes a backing pod only to apply image or resource drift.
    verbs: ["get", "list", "delete"]
  # Read eviction evidence after a sandbox pod has been deleted.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # On-demand workspace growth (Sandbox.growWorkspace): after an ENOSPC in
  # workspace prep the api reads the workspace PVC and merge-patches its
  # storage request one increment up (gp3 expands online). get/patch ONLY —
  # PVC create/delete stay with the agent-sandbox controller.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "patch"]
  # Kubernetes authorizes a pods/exec connection as subresource creation.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Build status reads the BuildKit pod log tail. It does not modify logs.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Sandbox images v2 plan, Task 5: BuildKit-Job image builder. Kept on its
  # own rule (mirrors the "sandboxes:patch" precedent above) rather than
  # folded into an unrelated resource's verb list, so the grant this Job
  # lifecycle needs is auditable independent of the Sandbox-CR grant.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # get: poll a build Job's status. create: dispatch one BuildKit Job.
    # delete: cancel or clean up with background pod propagation.
    verbs: ["create", "get", "delete"]
  # ConfigMap holds the generated Dockerfile per build (no secret material).
  # Kept minimal, mirroring the secrets rule below: the api only ever creates
  # and deletes these by name — it never reads a build ConfigMap back — so no
  # `get`/`list`/`watch`.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
  # Secret holds the per-build git clone token (see k8s-builder.ts's
  # docblock: created only for non-tokenless builds, deleted as soon as
  # `status()` observes a terminal build state, or immediately on cancel —
  # never left standing after the Job it was minted for finishes). Also used
  # for the per-sandbox creds Secret (SandboxCreateOpts.credsFiles /
  # SandboxProvider.updateCreds): upsert needs get (read resourceVersion for
  # replace), patch/update needed for live credential refresh, delete for
  # cleanup on sandbox destroy.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "valet.fullname" . }}-sandbox-operator
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "valet.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "valet.fullname" . }}-sandbox-operator
  apiGroup: rbac.authorization.k8s.io
