apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "valet.labels" . | nindent 4 }}
---
# Namespaced Role only — deliberately NO cluster-scoped permissions and NO
# PVC verbs. The agent-sandbox controller owns PVC lifecycle (it
# owner-references PVCs to the Sandbox CR); the api only ever touches the
# Sandbox CR itself plus the pod surface (exec/log) for command execution
# and file ops.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "valet.fullname" . }}-sandbox-operator
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "valet.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "valet.fullname" . }}-sandbox-operator
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "valet.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "valet.fullname" . }}-sandbox-operator
  apiGroup: rbac.authorization.k8s.io
