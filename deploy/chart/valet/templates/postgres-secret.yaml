{{- if and .Values.postgres.bundled (not .Values.externalDatabase.url) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "valet.fullname" . }}-postgres
  labels:
    {{- include "valet.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_PASSWORD: >-
    {{- if .Values.postgres.password }}
    {{ .Values.postgres.password }}
    {{- else }}
    {{ include "valet.retainedSecretValue" (dict "namespace" .Release.Namespace "name" (printf "%s-postgres" (include "valet.fullname" .)) "key" "POSTGRES_PASSWORD" "length" 32) }}
    {{- end }}
{{- end }}
