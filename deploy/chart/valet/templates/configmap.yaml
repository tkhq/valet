apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valet.fullname" . }}-config
  labels:
    {{- include "valet.labels" . | nindent 4 }}
data:
  BETTER_AUTH_URL: {{ .Values.api.betterAuthUrl | quote }}
  # Injected into every sandbox pod as VALET_API_URL (see
  # packages/api/src/main.ts / host.ts) — must be reachable FROM a sandbox
  # pod, unlike BETTER_AUTH_URL (the public ingress hostname). The api
  # Service's in-cluster DNS name always resolves from any namespace in the
  # cluster, including .Values.sandbox.namespace.
  VALET_SANDBOX_API_URL: {{ printf "http://%s-api.%s.svc.cluster.local:%v" (include "valet.fullname" .) .Release.Namespace .Values.service.port | quote }}
  VALET_SANDBOX_BACKEND: "kubernetes"
  VALET_SANDBOX_NAMESPACE: {{ .Values.sandbox.namespace | quote }}
  VALET_SANDBOX_IMAGE: {{ printf "%s:%s" .Values.sandbox.image.repository .Values.sandbox.image.tag | quote }}
  VALET_WEB_DIST_DIR: "/app/web/dist"
  # Sandbox images v2 plan, Task 5: kubernetes prebuild image builder +
  # registry wiring. VALET_IMAGE_BUILDER pins the kubernetes builder
  # explicitly rather than relying on the VALET_SANDBOX_BACKEND-paired
  # default (providers/image-builder.ts's `defaultBackendFor`) so a future
  # default-pairing change can't silently disable prebuilds on this chart.
  VALET_IMAGE_BUILDER: "kubernetes"
  {{- if and .Values.registry.bundled (not .Values.externalRegistry.url) }}
  VALET_PREBUILD_REGISTRY: {{ printf "%s-registry:5000" (include "valet.fullname" .) | quote }}
  VALET_PREBUILD_REGISTRY_INSECURE: "true"
  {{- else if .Values.externalRegistry.url }}
  VALET_PREBUILD_REGISTRY: {{ .Values.externalRegistry.url | quote }}
  VALET_PREBUILD_REGISTRY_INSECURE: "false"
  {{- if .Values.externalRegistry.pullSecret }}
  VALET_SANDBOX_IMAGE_PULL_SECRET: {{ .Values.externalRegistry.pullSecret | quote }}
  {{- end }}
  {{- end }}
  VALET_PREBUILD_BUILD_DEADLINE_SECONDS: {{ .Values.build.activeDeadlineSeconds | quote }}
  VALET_PREBUILD_BUILD_CPU_REQUEST: {{ .Values.build.resources.requests.cpu | quote }}
  VALET_PREBUILD_BUILD_CPU_LIMIT: {{ .Values.build.resources.limits.cpu | quote }}
  VALET_PREBUILD_BUILD_MEMORY_REQUEST: {{ .Values.build.resources.requests.memory | quote }}
  VALET_PREBUILD_BUILD_MEMORY_LIMIT: {{ .Values.build.resources.limits.memory | quote }}
  {{- if .Values.api.auth.oidcIssuer }}
  AUTH_OIDC_ISSUER: {{ .Values.api.auth.oidcIssuer | quote }}
  {{- end }}
  {{- if .Values.api.auth.oidcClientId }}
  AUTH_OIDC_CLIENT_ID: {{ .Values.api.auth.oidcClientId | quote }}
  {{- end }}
  {{- if .Values.api.auth.oidcName }}
  AUTH_OIDC_NAME: {{ .Values.api.auth.oidcName | quote }}
  {{- end }}
  {{- if .Values.api.auth.oidcDomain }}
  AUTH_OIDC_DOMAIN: {{ .Values.api.auth.oidcDomain | quote }}
  {{- end }}
  {{- if .Values.api.auth.googleClientId }}
  AUTH_GOOGLE_CLIENT_ID: {{ .Values.api.auth.googleClientId | quote }}
  {{- end }}
  {{- if .Values.api.auth.githubClientId }}
  AUTH_GITHUB_CLIENT_ID: {{ .Values.api.auth.githubClientId | quote }}
  {{- end }}
  {{- if .Values.api.auth.trustedOrigins }}
  AUTH_TRUSTED_ORIGINS: {{ .Values.api.auth.trustedOrigins | quote }}
  {{- end }}
  {{- if .Values.api.auth.allowedEmailDomains }}
  AUTH_ALLOWED_EMAIL_DOMAINS: {{ .Values.api.auth.allowedEmailDomains | quote }}
  {{- end }}
