apiVersion: v1
kind: Secret
metadata:
  name: {{ include "valet.fullname" . }}-app
  labels:
    {{- include "valet.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: >-
    {{- if .Values.api.secrets.betterAuthSecret }}
    {{ .Values.api.secrets.betterAuthSecret }}
    {{- else }}
    {{ include "valet.retainedSecretValue" (dict "namespace" .Release.Namespace "name" (printf "%s-app" (include "valet.fullname" .)) "key" "BETTER_AUTH_SECRET" "length" 48) }}
    {{- end }}
  VALET_ENCRYPTION_KEY: >-
    {{- if .Values.api.secrets.encryptionKey }}
    {{ .Values.api.secrets.encryptionKey }}
    {{- else }}
    {{ include "valet.retainedSecretValue" (dict "namespace" .Release.Namespace "name" (printf "%s-app" (include "valet.fullname" .)) "key" "VALET_ENCRYPTION_KEY" "length" 32) }}
    {{- end }}
  ANTHROPIC_API_KEY: {{ .Values.api.secrets.anthropicApiKey | quote }}
  {{- if .Values.api.secrets.oidcClientSecret }}
  AUTH_OIDC_CLIENT_SECRET: {{ .Values.api.secrets.oidcClientSecret | quote }}
  {{- end }}
  {{- if .Values.api.secrets.googleClientSecret }}
  AUTH_GOOGLE_CLIENT_SECRET: {{ .Values.api.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.api.secrets.githubClientSecret }}
  AUTH_GITHUB_CLIENT_SECRET: {{ .Values.api.secrets.githubClientSecret | quote }}
  {{- end }}
  {{- if .Values.externalDatabase.url }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
