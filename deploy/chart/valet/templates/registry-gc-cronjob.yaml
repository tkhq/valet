{{- if and .Values.registry.bundled (not .Values.externalRegistry.url) }}
# Registry garbage-collect CronJob.
#
# The upstream `registry garbage-collect --delete-untagged=true` command
# reclaims two categories of storage:
#   1. Blobs orphaned by the retention seam's manifest deletes
#      (registryManifestDelete in packages/api/src/prebuilds/service.ts
#      removes the manifest ref; layer blobs are freed only by a GC pass).
#   2. Untagged manifests — intermediate layers from superseded builds that
#      were never given a tag but still consume storage.
#
# ── RWO PVC / live-registry caveat ──────────────────────────────────────
# This CronJob mounts the same RWO PVC as the live registry StatefulSet.
# On a single-node cluster (Rancher Desktop, k3s) the kubelet allows a
# second pod to bind a RWO volume on the same node, so the mount succeeds.
# GC walks the storage directory while the registry Pod serves read/write
# traffic. A push landing mid-GC-run can race a blob deletion. This race
# is low-risk given the low write volume (infrequent scheduled rebuilds and
# occasional manual triggers). Accept this trade-off for the pre-1.0
# bundled registry. Before this registry sees meaningful concurrent write
# traffic, add a maintenance window or a --readonly flip via a
# ConfigMap-mounted config.yml that the live StatefulSet also reads.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "valet.fullname" . }}-registry-gc
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "valet.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-gc
spec:
  schedule: {{ .Values.registry.gcSchedule | quote }}
  concurrencyPolicy: Forbid
  # Without history limits every finished/failed GC Job pod is retained
  # forever, each occupying a kubelet pod slot.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # Same one-hour TTL as the BuildKit Jobs (k8s-builder.ts).
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "valet.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: registry-gc
        spec:
          restartPolicy: Never
          containers:
            - name: registry-gc
              image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
              command: ["registry", "garbage-collect", "--delete-untagged=true", "/etc/docker/registry/config.yml"]
              env:
                - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
                  value: /var/lib/registry
              volumeMounts:
                - name: data
                  mountPath: /var/lib/registry
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-{{ include "valet.fullname" . }}-registry-0
{{- end }}
