apiVersion: v1
kind: Service
metadata:
  name: {{ include "valet.fullname" . }}-api
  labels:
    {{- include "valet.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "valet.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
