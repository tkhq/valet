{{- if and .Values.registry.bundled (not .Values.externalRegistry.url) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "valet.fullname" . }}-registry
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "valet.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  serviceName: {{ include "valet.fullname" . }}-registry
  replicas: 1
  selector:
    matchLabels:
      {{- include "valet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: registry
  template:
    metadata:
      annotations:
        checksum/registry-health: {{ include (print $.Template.BasePath "/registry-health-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "valet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: registry
    spec:
      containers:
        - name: registry
          image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
          ports:
            - containerPort: 5000
              name: registry
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            # Required for the prebuild retention seam's manifest-digest
            # DELETE (packages/api/src/prebuilds/service.ts's
            # `registryManifestDelete`) to actually remove blobs instead of
            # 405ing — the registry image defaults this to false.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 15
            periodSeconds: 10
        - name: registry-health
          image: "{{ .Values.registry.health.image.repository }}:{{ .Values.registry.health.image.tag }}"
          command: ["python3", "-B", "/opt/registry-health/registry-health.py"]
          ports:
            - containerPort: 5001
              name: registry-health
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
              readOnly: true
            - name: registry-health
              mountPath: /opt/registry-health
              readOnly: true
      volumes:
        - name: registry-health
          configMap:
            name: {{ include "valet.fullname" . }}-registry-health
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.registry.storageClassName }}
        storageClassName: {{ .Values.registry.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.registry.storageSize | quote }}
{{- end }}
