apiVersion: 1
groups:
  - orgId: 1
    name: valet-events
    folder: Valet
    interval: 1m
    rules:
      # An `existing` thread pin that cannot take deliveries dead-letters each
      # delivery and disables a pinned schedule. No code repairs the rule, so
      # a person must pick another thread (delivery threads spec, Part E).
      - uid: valet-event-delivery-pin-unavailable
        title: Valet rule's pinned thread cannot take deliveries
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              # Include the first nonzero sample of a newly created counter series.
              expr: '(sum(increase(valet_event_delivery_destination_total{reason="pin_unavailable"}[10m])) or vector(0)) + (sum(valet_event_delivery_destination_total{reason="pin_unavailable"} unless valet_event_delivery_destination_total{reason="pin_unavailable"} offset 10m) or vector(0)) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: A rule or schedule pins a thread that is archived, deleted, or outside its owner's workspace.
          description: Find the dead-lettered delivery or the disabled schedule in the event log. Ask the owner to pick another thread for the rule in Presence.
        labels: { severity: critical }

      # Do not expire blocking approvals to hide a provider outage.
      - uid: valet-attention-delivery-recovery-failed
        title: Valet personal notification recovery is failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(sum(increase(valet_attention_delivery_failures_total{retry="true"}[30m])) or vector(0)) + (sum(valet_attention_delivery_failures_total{retry="true"} unless valet_attention_delivery_failures_total{retry="true"} offset 30m) or vector(0)) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: Personal attention delivery failed again during recovery.
          description: Inspect pending_channel_deliveries.last_error and the channel startup logs. Restore bot credentials or ask the user to reconnect the channel. Pending approvals keep retrying until handled.
        labels: { severity: warning }

      - uid: valet-attention-oldest-job
        title: Valet personal notification queue is too old
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max(valet_attention_oldest_job_age_seconds) > 1800'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: A personal attention job has waited more than 30 minutes.
          description: Inspect pending_channel_deliveries and channel startup logs. Restore the channel or resolve the pending request. Jobs do not expire.
        labels: { severity: warning }
