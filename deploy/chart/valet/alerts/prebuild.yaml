apiVersion: 1
groups:
  - orgId: 1
    name: valet-prebuilds
    folder: Valet
    interval: 1m
    rules:
      - uid: valet-prebuild-stuck-queue
        title: Valet prebuild queue is stuck
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(valet_prebuild_queue_depth) > 0 and (sum(increase(valet_prebuild_builds_total{outcome="started"}[15m])) or vector(0)) == 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model: &threshold
              expression: A
              type: threshold
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: The prebuild queue has work but no bake has started for 15 minutes.
        labels: { severity: warning }
      - uid: valet-prebuild-failures
        title: Valet prebuild failures are sustained
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(valet_prebuild_builds_total{outcome="failed"}[15m])) / clamp_min(sum(rate(valet_prebuild_builds_total{outcome=~"succeeded|failed"}[15m])), 0.001) > 0.2'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model: *threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: More than 20 percent of terminal prebuilds failed for 15 minutes.
        labels: { severity: warning }
      - uid: valet-prebuild-queue-age
        title: Valet prebuild queue age is excessive
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max(valet_prebuild_queue_oldest_age_seconds) > 900'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model: *threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: A prebuild has remained queued for more than 15 minutes.
        labels: { severity: warning }
      - uid: valet-prebuild-registry-divergence
        title: Valet bake state differs from registry state
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(valet_prebuild_registry_reconciliations_total{outcome="missing"}[10m])) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model: *threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: A session preflight found that a bake image is missing from the registry.
        labels: { severity: critical }
      - uid: valet-sandbox-token-rejected
        title: Valet sandbox credential is invalid
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              # Include the first nonzero sample of a newly created counter series.
              expr: '(sum(increase(valet_sandbox_token_rejected_total[10m])) or vector(0)) + (sum(valet_sandbox_token_rejected_total unless valet_sandbox_token_rejected_total offset 10m) or vector(0)) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model: *threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: A session with a sandbox presented an expired or revoked credential.
          description: Check API restart and teardown logs. Recreate the affected sandbox if its credential was already invalid before upgrade.
        labels: { severity: critical }
      # A reclaimed child must leave no active session and no working
      # directory (ChildWatcher.retireChild). Nothing repairs a violation.
      - uid: valet-child-retire-incomplete
        title: Valet children stay active or keep working directories after reclaim
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(max(valet_children_reclaimed_active) or vector(0)) + (max(valet_child_workspaces{state="retired"}) or vector(0)) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model: *threshold
        noDataState: OK
        execErrState: Alerting
        for: 30m
        annotations:
          summary: Reclaimed children still hold an active session or a working directory on the api host.
          description: Read the api log for child_workspace_release errors. Fix the sandbox backend, then delete the listed working directories.
        labels: { severity: warning }
      - uid: valet-child-reclaim-failures
        title: Valet child sandbox reclaim is failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              # Include the first nonzero sample of a newly created counter series.
              expr: '(sum(increase(valet_child_reclaim_failures_total[30m])) or vector(0)) + (sum(valet_child_reclaim_failures_total unless valet_child_reclaim_failures_total offset 30m) or vector(0)) > 0'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model: *threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: A child sandbox park, retention reclaim or working-directory release failed.
          description: Read the api log for child_sandbox_park, child_retention_reclaim and child_workspace_release errors, then check the sandbox backend.
        labels: { severity: warning }
