name: Secrets Handling
detect_when:
  - "API paths contain api-key, token, secret, or credential"
  - "The code references vault, secrets-manager, KMS, or environment variable management"
  - "Requests carry authorization headers with API keys or bearer tokens"

threat_patterns:
  secret_in_source:
    description: Hardcoded secrets in source code or configuration
    cwe: CWE-798
    capec: null
    mitre_attack: T1552
    skill: low
    likelihood: high
    prereqs:
      - Source code or configuration files are accessible
      - The application uses API keys or credentials
    look_for:
      - API keys in source files
      - passwords in configuration files committed to git
      - secrets in environment variable defaults
      - credentials in CI/CD pipeline configs
      - secrets in Docker images or build artifacts

  secret_in_transit:
    description: Secrets exposed during transmission
    cwe: CWE-319
    capec: null
    mitre_attack: null
    skill: low
    likelihood: medium
    prereqs:
      - Secrets are transmitted between client and server
      - Network traffic is observable
    look_for:
      - secrets in URL query parameters (logged by proxies)
      - credentials in HTTP headers visible to intermediaries
      - secrets in WebSocket messages without TLS
      - API keys in client-side JavaScript bundles

  secret_in_logs:
    description: Secrets captured in application or system logs
    cwe: CWE-532
    capec: null
    mitre_attack: null
    skill: low
    likelihood: medium
    prereqs:
      - The application has logging enabled
      - Request or error logging captures headers or bodies
    look_for:
      - request/response logging including auth headers
      - error messages containing credentials
      - debug logging with secret values
      - audit logs storing plaintext passwords

  secret_in_response:
    description: Secrets returned in API responses to unauthorized parties
    cwe: CWE-200
    capec: null
    mitre_attack: null
    skill: low
    likelihood: medium
    prereqs:
      - API key or secret management endpoints exist
      - Secrets are returned in API responses
    look_for:
      - an API key that should be one-time-show returned again
      - a full secret returned on list or get endpoints
      - another user's API keys visible to non-owners
      - secrets in error responses or debug output

  insufficient_secret_scoping:
    description: Secrets with broader access than needed
    cwe: CWE-269
    capec: null
    mitre_attack: null
    skill: medium
    likelihood: medium
    prereqs:
      - API keys or service accounts are in use
      - A scope or permission model for secrets exists
    look_for:
      - API keys with full access when a limited scope suffices
      - no ability to scope a secret to specific resources
      - service accounts with admin privileges
      - shared secrets across environments

  missing_secret_rotation:
    description: No mechanism to rotate a compromised secret
    cwe: CWE-320
    capec: null
    mitre_attack: null
    skill: low
    likelihood: medium
    prereqs:
      - Long-lived API keys or credentials are in use
      - No rotation endpoint is observed
    look_for:
      - no API for key rotation
      - rotation requires a service restart
      - old secrets remain valid after rotation
      - no secret expiry mechanism
