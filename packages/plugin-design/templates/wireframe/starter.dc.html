<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="valet-design" content="v=1; template=wireframe">
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; background: #fafafa; color: #333; }
    .frame { border: 2px solid #999; border-radius: 6px; background: #fff; padding: 1rem; margin-bottom: 1.5rem; }
    .box { border: 1.5px dashed #aaa; border-radius: 4px; padding: 1rem; margin: 0.5rem 0; color: #777; text-align: center; }
    .row { display: flex; gap: 0.5rem; }
    .row > .box { flex: 1; }
    h1 { font-size: 1.2rem; color: #555; }
  </style>
</head>
<body>
  <h1>Screen: Untitled</h1>
  <div class="frame">
    <div class="box">Header / nav</div>
    <div class="row">
      <div class="box">Sidebar</div>
      <div class="box">Main content</div>
    </div>
    <div class="box">Footer</div>
  </div>
</body>
<!-- valet-design:meta

</html>
