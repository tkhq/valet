<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="valet-design" content="v=1; template=html-email">
  <style>
    body { margin: 0; background: #f4f4f7; font-family: Arial, Helvetica, sans-serif; }
    .email { max-width: 600px; margin: 2rem auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
    .email-header { background: var(--color-primary, #1d4ed8); color: #ffffff; padding: 24px 32px; }
    .email-header h1 { margin: 0; font-size: 22px; }
    .email-body { padding: 24px 32px; color: #333; font-size: 15px; line-height: 1.5; }
    .cta { display: inline-block; background: var(--color-primary, #1d4ed8); color: #fff; padding: 12px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    .email-footer { padding: 16px 32px; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <div class="email">
    <div class="email-header">
      <h1>Subject line</h1>
    </div>
    <div class="email-body">
      <p>Hi there,</p>
      <p>One short paragraph that earns the click.</p>
      <p><a class="cta" href="#">Call to action</a></p>
    </div>
    <div class="email-footer">
      <p>Company · Address · Unsubscribe</p>
    </div>
  </div>
</body>
<!-- valet-design:meta

</html>
