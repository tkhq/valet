<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="valet-design" content="v=1; template=resume">
  <style>
    body { font-family: 'Helvetica Neue', system-ui, sans-serif; margin: 3rem auto; max-width: 44rem; color: #222; line-height: 1.45; }
    header h1 { font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; }
    header p { margin: 0.2rem 0 0; color: #666; }
    h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid #ddd; padding-bottom: 0.2rem; margin-top: 1.8rem; color: var(--color-primary, #1d4ed8); }
    .role { display: flex; justify-content: space-between; font-weight: 600; margin-top: 0.8rem; }
    .role span:last-child { color: #888; font-weight: 400; }
    ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }
  </style>
</head>
<body>
  <header>
    <h1>Full Name</h1>
    <p>Role · City · email@example.com</p>
  </header>
  <h2>Experience</h2>
  <p class="role"><span>Title, Company</span><span>2023–present</span></p>
  <ul>
    <li>Achievement with a number in it.</li>
  </ul>
  <h2>Education</h2>
  <p class="role"><span>Degree, School</span><span>Year</span></p>
</body>

</html>
