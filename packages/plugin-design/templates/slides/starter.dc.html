<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="valet-design" content="v=1; template=slides">
  <style>
    body { margin: 0; font-family: var(--font-sans, system-ui, sans-serif); color: var(--color-fg, #1a1a2e); }
    /* Slides are authored on a fixed 1920x1080 stage; the canvas scales
       to fit. Use absolute px type sizes at this resolution. */
    section { width: 1920px; height: 1080px; box-sizing: border-box; padding: 96px; display: flex; flex-direction: column; justify-content: center; background: var(--color-bg, #ffffff); }
    section h1 { font-size: 96px; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 24px; color: var(--color-primary, #1d4ed8); }
    section h2 { font-size: 64px; line-height: 1.1; margin: 0 0 24px; }
    section p { font-size: 34px; line-height: 1.4; margin: 8px 0; }
    section aside { display: none; }
  </style>
</head>
<body>
  <section data-label="Title" data-speaker-notes="Opening notes.">
    <h1>Deck Title</h1>
    <p>Subtitle or presenter line.</p>
  </section>
  <section data-label="First Point" data-speaker-notes="Speaker notes for this slide.">
    <h2>First Point</h2>
    <p>Supporting detail.</p>
  </section>
</body>
<!-- valet-design:meta

  "v": 1,
  "template": "slides"
}
-->
</html>
