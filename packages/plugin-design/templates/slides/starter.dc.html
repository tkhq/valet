<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="valet-design" content="v=1; template=slides">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: var(--color-fg, #1a1a2e); }
    section { box-sizing: border-box; width: 100%; aspect-ratio: 16 / 9; padding: 4rem 5rem; display: flex; flex-direction: column; justify-content: center; background: var(--color-bg, #ffffff); border-bottom: 1px solid #e5e5ef; }
    section h1 { font-size: 3rem; margin: 0 0 1rem; color: var(--color-primary, #1d4ed8); }
    section h2 { font-size: 2.2rem; margin: 0 0 1rem; }
    section p { font-size: 1.4rem; margin: 0.3rem 0; }
    section aside { display: none; }
  </style>
</head>
<body>
  <section>
    <h1>Deck Title</h1>
    <p>Subtitle or presenter line.</p>
    <aside>Opening notes.</aside>
  </section>
  <section>
    <h2>First Point</h2>
    <p>Supporting detail.</p>
    <aside>Speaker notes for this slide.</aside>
  </section>
</body>

</html>
