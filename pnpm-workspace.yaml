packages:
  - 'packages/*'

# Dependency version overrides. These MUST live here, not in package.json's
# `pnpm` field: pnpm 11 stopped reading that field, which silently drops these
# pins. The zod pin keeps pi-ai and pi-agent-core on one zod copy, so their
# provider registry stays a shared singleton. See CLAUDE.md "Node & workspace
# traps".
overrides:
  '@mariozechner/pi-ai>zod': 4.4.3
  '@mariozechner/pi-agent-core>zod': 4.4.3

# Dependencies allowed to run install scripts (native builds). pnpm 10 blocks
# unlisted build scripts and prints an "Ignored build scripts" warning; pnpm 11
# fails `pnpm install` — and the deps-status precheck that `pnpm <script>` runs
# first — with a non-zero exit. This allowlist is that approval, so a fresh
# clone installs and tests clean. To refresh after a dependency change, run
# `pnpm approve-builds` and copy its selection here.
onlyBuiltDependencies:
  - '@google/genai'
  - better-sqlite3
  - esbuild
  - protobufjs
  - sharp
  - tesseract.js
  - workerd
