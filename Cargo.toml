[workspace]
members = ["crates/valet-policy-engine"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.98.1"

[workspace.dependencies]
regorus = { version = "=0.12.0", default-features = false, features = ["arc", "base64", "base64url", "glob", "graph", "hex", "jsonpatch", "no_std", "regex", "semver", "urlquery", "yaml"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
