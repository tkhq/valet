checks:
- type: review_match
  golden:
  - comment: The Earn guard sends every non-Solana account (BTC, Cosmos, Tron) through the EVM wrapper checks. HexToAddress
      ignores decode errors, so every bech32 BTC address maps to the same 0x…bc address, and one dust deposit there blocks
      deleting every sub-org that has an unexported BTC account.
    category: security
    severity: High
    fix: Check the EVM wrappers only for EVM-format addresses and skip other address formats.
  - comment: The delete guard walks wallet accounts only. Private keys can also sign Earn deposits, and deleteWithoutExport
      deletes unexported private keys, so a sub-org that deposited from a private key can delete itself and strand the position.
    category: security
    severity: High
    fix: Run the Earn guard over the addresses of unexported private keys too.
