  body: "## Summary\r

    \r

    <img width=\"1030\" height=\"334\" alt=\"imagen\" src=\"https://github.com/user-attachments/assets/9062880e-272f-40b4-8bae-1a95740fbfdb\" />\r

    \r

    <img width=\"1546\" height=\"300\" alt=\"imagen\" src=\"https://github.com/user-attachments/assets/6b83edf5-b6a3-404d-8e16-070d18fb7214\" />\r

    \r

    \r

    This pull request introduces a new feature to manage calendar cache data, including the ability to view cache status and delete cached data. It also includes several supporting updates to repositories, APIs, and UI components. Below is a summary of the most important changes grouped by theme.\r

    \r

    ### New Feature: Calendar Cache Management\r

    * Added a `deleteCache` mutation to the TRPC `calendarsRouter`, enabling users to delete cached calendar data by credential ID. (`[packages/trpc/server/routers/viewer/calendars/_router.tsxR27-R33](diffhunk://#diff-9e053175cc6dfb5717313e0587a730fff132f9d3c1200204f0ce8dac53a19280R27-R33)`)\r

    * Introduced the `deleteCacheHandler` to handle cache deletion logic, including validation of user access to the specified credential. (`[packages/trpc/server/routers/viewer/calendars/deleteCache.handler.tsR1-R33](diffhunk://#diff-572888b8e0555167a5787847f29d5a46623eff170491acc0654e916f5b4afd18R1-R33)`)\r

    * Updated the `connectedCalendarsHandler` to enrich calendar data with cache status (`cacheUpdatedAt`) by querying the `CalendarCacheRepository`. (`[packages/trpc/server/routers/viewer/calendars/connectedCalendars.handler.tsR27-R39](diffhunk://#diff-3f6a556ad60f26d0162770fcd81b5bddeb6ab0437552ac792045c3cd2608d710R27-R39)`)\r

    \r

    ### UI Enhancements\r

    * Created a new `CredentialActionsDropdown` component to display cache status and provide options to delete cached data or disconnect integrations. (`[packages/features/apps/components/CredentialActionsDropdown.tsxR1-R134](diffhunk://#diff-c78273434b95ab8276bb5eb24d9bc088b10af029388bdcd08cbe478f44269b31R1-R134)`)\r

    * Replaced the `DisconnectIntegration` component with `CredentialActionsDropdown` in the `SelectedCalendarsSettingsWebWrapper` UI, integrating the new cache management functionality. (`[[1]](diffhunk://#diff-831b0874e07f01721f87926262c5c9674ff9d7443741dfb71ceb849656345b00L5-R5)`, `[[2]](diffhunk://#diff-831b0874e07f01721f87926262c5c9674ff9d7443741dfb71ceb849656345b00L70-L81)`, `[[3]](diffhunk://#diff-831b0874e07f01721f87926262c5c9674ff9d7443741dfb71ceb849656345b00L125-L135)`)\r

    \r

    ### Repository and Database Updates\r

    * Added a `getCacheStatusByCredentialIds` method to the `CalendarCacheRepository` and its mock implementation to fetch cache statuses for multiple credentials. (`[[1]](diffhunk://#diff-b36c72c0db751ba0cafe234dfa150817672869825333c22b074c4977a6135b8dR30-R32)`, `[[2]](diffhunk://#diff-ceffbae9ef3da413495feac73a341672e77ffaf493cf67ada0b637ead80ded38R26-R30)`, `[[3]](diffhunk://#diff-4cf8d3089fad7b6c8fe4172d8d42147f136b65baf30b726e57b9b10d179d4a99R172-R188)`)\r

    * Introduced a new `updateManyByCredentialId` method in the `SelectedCalendarRepository` to update multiple calendars by credential ID. (`[packages/lib/server/repository/selectedCalendar.tsR400-R406](diffhunk://#diff-ccb4eecfa701e5b0c7d6ba87dcc550cdf3700a63ee252849045611599ecb9273R400-R406)`)\r

    * Added an `updatedAt` column to the `CalendarCache` table in the database schema and Prisma model to track the last update timestamp. (`[[1]](diffhunk://#diff-9f597bd98bbcfdcf4861ee7bf0c238e7dfe54b456ceb69b852aaf3979c4102cfR1-R8)`, `[[2]](diffhunk://#diff-56fa4d384ba6fb94b130e9eb42c5cad00734b025ebd6c197f76873469725ae87R1718)`)\r

    \r

    ### Localization and Strings\r

    * Added new localization strings for cache management actions, such as \"Cache Status,\" \"Delete cached data,\" and \"Cache deleted successfully.\" (`[apps/web/public/static/locales/en/common.jsonR3376-R3382](diffhunk://#diff-57de4b8e5231f1d699891d98b0381d56e9e24537b0ca5420d1fba4f0597370bcR3376-R3382)`)\r

    \r

    ### Miscellaneous\r

    * Updated `package.json` to replace `ts-node` with `npx tsx` for running the `dev:cron` script. (`[apps/web/package.jsonL11-R11](diffhunk://#diff-14b60f636e1a2b0061da57aaf231cb1ed15a5dc0c592425ed82e58fec95d42d8L11-R11)`)\r

    \r

    ## Review & Testing Checklist for Human\r

    \r

    **🔴 High Priority (5 items)**\r

    \r

    - [x] **Verify deleteCache tRPC mutation exists** - The component references `trpc.viewer.calendars.deleteCache.useMutation()` but this mutation implementation is not visible in the PR changes. Check if this endpoint exists or needs to be created.\r

    - [x] **End-to-end testing with Google Calendar** - Install a Google Calendar integration and verify the credential-level dropdown appears, shows cache status, and deletion flow works correctly with confirmation dialog.\r

    - [x] **Test cache status display logic** - Verify that `cacheUpdatedAt` timestamps are correctly formatted and displayed only for Google Calendar credentials with actual cache data.\r

    - [x] **Confirm repository pattern correctness** - Test that `getCacheStatusByCredentialIds()` returns accurate data and the credential-to-cache mapping works properly in the UI.\r

    - [x] **Verify dropdown conditional rendering** - Ensure the dropdown only appears for Google Calendar credentials and handles edge cases (no cache, disabled integrations, etc.).\r

    \r

    **Recommended Test Plan:**\r

    1. Connect a Google Calendar integration to trigger cache creation\r

    2. Navigate to `/apps/installed/calendar` \r

    3. Verify dropdown appears on Google Calendar credential with cache status and timestamp\r

    4. Test \"Delete cached data\" action shows confirmation dialog\r

    5. Confirm cache deletion works and UI updates appropriately\r

    6. Test \"Remove App\" functionality still works correctly\r

    \r

