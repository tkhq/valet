  title: Advanced date override handling and timezone compatibility improvements
  body: "## What does this PR do?\r

    \r

    This PR fixes that date overrides of fixed hosts are taken into account for round-robin events. This prevents round-robin events being booked where the fixed hosts are unavailable. \r

    \r

    This PR also fixes that date overrides didn't adjust to different timezones. If the organizer has a date override from 10-11 UTC it always showed the slots from 10-11 open no matter what timezone the attendee has.\r

    \r

    Fixes #8207\r

    Fixes #8329\r

    \r

    Fixes: #8273\r

    \r

    **Environment**: Staging(main branch) / Production\r

    \r

    ## Type of change\r

    \r

    - Bug fix (non-breaking change which fixes an issue)\r

    \r

    ## How should this be tested?\r

    \r

    **Date overrides for fixed hosts (round-robin):** \r

    - Create a round-robin event with one fixed host and host round-robin host\r

    - Create a date override for fixed host (round-robin host should also be available at that time)\r

    - Check available slots of event on the day of the date override, it should only show the slots where fixed host is available\r

    - Test that with different time zones on booking page and on the availabilities of fixed and round-robin host\r

    \r

    **Date override timezones issue:** \r

    - Create a date override \r

    - Go to the booking page of a personal event \r

    - Change the timezone to a different one that the availability with the date override is \r

    - See the available slots of the day with the date override change accordingly \r

    - Also test with different timezones here \r

    \r\n"
