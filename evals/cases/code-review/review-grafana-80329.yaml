  title: Database Performance Optimizations
  body: "**What is this feature?**\r

    \r

    Writes to annotations are sometimes rejected on MySQL due to a recurring deadlock with the annotation cleanup job.\r

    Details here: https://github.com/grafana/grafana/issues/64979\r

    \r

    **Why do we need this feature?**\r

    \r

    The deadlock seems to be a result of the subquery, under normal circumstances a plain insert and delete should not lock, and there are no extended transactions at play.\r

    \r

    This PR splits the subquery into a separate SQL statement. These statements do not share a transaction, and therefore allow locks to flush in between.\r

    \r

    Unfortunately we could not reduce this to a single DELETE statement, due to the batching - DELETE LIMIT is not supported on all databases without needing to reintroduce the subquery. The IDs loaded into memory are of bounded size due to the batch size configuration.\r

    \r

    **Which issue(s) does this PR fix?**:\r

    \r

    https://github.com/grafana/grafana/issues/64979\r

    \r

    **Special notes for your reviewer:**\r

    \r

    Please check that:\r

    - [x] It works as expected from a user's perspective.\r

    - [x] If this is a pre-GA feature, it is behind a feature toggle.\r

    - [x] The docs are updated, and if this is a [notable improvement](https://grafana.com/docs/writers-toolkit/writing-guide/contribute-release-notes/#how-to-determine-if-content-belongs-in-a-whats-new-document), it's added to our [What's New](https://grafana.com/docs/writers-toolkit/writing-guide/contribute-release-notes/) doc.\r\n"
