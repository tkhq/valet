  title: Comprehensive workflow reminder management for booking lifecycle events
  body: "## What does this PR do?\r

    \r

    Fixes that workflow emails are still sent for cancelled and rescheduled bookings. The fix of PR #6991 was wrong and didn't work as expected. \r

    \r

    The SendGrid endpoint `DELETE /v3/user/scheduled_sends/${referenceId}` was not used correctly. This endpoint deletes a cancelled scheduled email from `scheduled_sends` by removing the 'cancel' status (so email will again be scheduled). \r

    \r

    The reason why cancelling our scheduled emails stopped working is that all cancerlled emails are saved in `scheduled_sends` until the scheduled date but the max. of pending cancellations is 100. Once we reached 100 pending cancellations, new cancellations failed and emails were still sent out. \r

    \r

    The solution implemented in this PR: \r

    - A new field `cancelled` is added to the `workflowReminder` model\r

    - Once an already scheduled email is cancelled, the field is set to true (nothing else is done at this point in time)\r

    - The CRON job `scheduleEmailReminders` is responsible for the final cancellation of the scheduled email (runs every 15 mins)\r

    \  - cancels all scheduled emails that are cancelled and that have their scheduled date within the next hour\r

    \r

    Fixes #7225\r

    \r

    **Environment**: Staging(main branch) / Production\r

    \r

    ## Type of change\r

    \r

    - [x] Bug fix (non-breaking change which fixes an issue)\r

    - [ ] Chore (refactoring code, technical debt, workflow improvements)\r

    - [ ] New feature (non-breaking change which adds functionality)\r

    - [ ] Breaking change (fix or feature that would cause existing functionality to not work as expected)\r

    - [ ] This change requires a documentation update\r\n"
