    - Improves index build speed using finer grain locking when writing the index cache. We were locking the whole `BuildIndex` function, which was slowing things down when building many namespaces with high concurrency.\r

    \r

    Notes for reviewer:\r

    - Does anything else depend on initializing US lazily? What could this break?"
