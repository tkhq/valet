  body: "## What does this PR do?\r

    \r

    - Converts destinationCalendar on CalendarEvent to be an array.\r

    - Patches and fixes so every sentence of code that was using evet.destinationCalendar can support the new type of array.\r

    - The logic here is to fallback to normal behaviour has having one main destinationCalendar but also supports multiple so host can get invited correctly.\r

    \r

    Fixes #7754 \r

