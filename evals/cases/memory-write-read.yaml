# Placeholder case for the loader (TKAI-328). The runner lands in TKAI-329;
# the real starter suite lands in TKAI-333.
id: memory-write-read
description: Write a memory entry, read it back, and confirm the content survived.
turns:
  - role: user
    content: >-
      Store the fact "the deploy freeze ends Friday" in memory under the key
      deploy-freeze, then read it back and repeat the stored text verbatim.
timeout_ms: 120000
checks:
  - type: tool_called
    tool: mem_write
  - type: tool_called
    tool: mem_read
    after: mem_write
  - type: output_contains
    value: the deploy freeze ends Friday
  - type: all_terminal
  - type: no_errors
