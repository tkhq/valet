id: memory-source-citations
description: Cite the memory file that supports each deployment fact.
turns:
  - role: user
    content: >-
      Write notes/citation-pilot.md with these facts: Project Alder deploys on Friday.
      Mira owns its release. Read the file back with mem_read.
      Then tell me when Alder deploys and who owns the release.
      Cite the returned source id after each fact.
timeout_ms: 120000
checks:
  - type: tool_called
    tool: mem_read
  - type: citation_validity
  - type: judge_output
    rubric: >-
      The reply states that Alder deploys on Friday and Mira owns the release.
      Each fact has a source citation from the memory read.
      Score 5 only if both facts have citations. Uncited facts score at most 2.
      A caveat about the source, such as that it reports a cause nobody verified or that it may be out of date, is not an uncited fact and does not lower the score.
  - type: no_errors
