id: multi-source-attribution
description: Attribute launch timing and a release blocker to their separate sources.
profile: mock
turns:
  - role: user
    content: >-
      Read the recent messages in Slack channel C0LAUNCH and issue 42 in acme/valet.
      Tell me the launch date and the release blocker.
timeout_ms: 120000
mock_tools:
  slack.read_history:
    response: '{"channel":"C0LAUNCH","messages":[{"ts":"1730800000.000100","text":"The launch is on Tuesday, Nov 12."}]}'
    sources:
      - service: slack
        title: Launch date
        url: https://acme.slack.com/archives/C0LAUNCH/p1730800000000100
        snippet: The launch is on Tuesday, Nov 12.
  github.get_issue:
    response: '{"number":42,"title":"Release blocker","state":"open","body":"The release is blocked by early session cookie expiry."}'
    sources:
      - service: github
        title: acme/valet#42 Release blocker
        url: https://github.com/acme/valet/issues/42
        snippet: The release is blocked by early session cookie expiry.
checks:
  - type: tool_called
    tool: slack.read_history
  - type: tool_called
    tool: github.get_issue
  - type: citation_validity
  - type: judge_output
    rubric: >-
      The reply states that launch is Tuesday, Nov 12, and attributes that fact to the Slack source.
      It states that early session cookie expiry blocks release and attributes that fact to the GitHub issue source.
      Score 5 only when each fact cites its own supporting source id. Swapped sources, one source for both facts,
      or any uncited fact score at most 2.
      A caveat about the source, such as that it reports a cause nobody verified or that it may be out of date, is not an uncited fact and does not lower the score.
  - type: no_errors
