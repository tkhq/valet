# Mock-profile starter case (TKAI-335): integration reasoning with canned
# plugin responses. Real github tool schemas, no credentials, no network.
id: mock-github-triage
description: Triage open pull requests from a mocked GitHub listing.
profile: mock
turns:
  - role: user
    content: >-
      List the open pull requests in acme/valet with your GitHub tools and
      tell me the number and title of the oldest one. The listing is already
      sorted newest first.
timeout_ms: 180000
mock_tools:
  github.list_pull_requests:
    response: |
      [
        {"number": 48, "title": "Add retry to webhook delivery", "state": "open", "created_at": "2026-08-30T10:00:00Z"},
        {"number": 42, "title": "Fix auth token refresh", "state": "open", "created_at": "2026-08-20T09:00:00Z"}
      ]
checks:
  - type: tool_called
    tool: github.list_pull_requests
  - type: tool_args_match
    tool: github.list_pull_requests
    args:
      owner: acme
      repo: valet
  - type: tool_result_matches
    tool: github.list_pull_requests
    pattern: "Fix auth token refresh"
  - type: output_contains
    value: "42"
  - type: no_errors
