# Compaction inside one turn: a long triage turn crosses the window, and
# the pass before the next model call summarizes the turn's own start. The
# resumed turn must still know its task, must not repeat the reaction it
# already added, and must not mistake its own reaction for another run's.
# `context_window_tokens` makes the engine assume a small window, so the
# pass runs inside the turn.
id: compaction-midturn-task
description: A compaction inside a long turn keeps the task and the calls already made.
profile: mock
context_window_tokens: 30000
turns:
  - role: user
    content: >-
      Alert 4711 fired in channel C0PROD (post ts 1700000000.000100). Do these
      steps in order. 1. Add the reaction "eyes" to that post (slack.add_reaction
      with channel C0PROD, timestamp 1700000000.000100, name eyes). This marks
      the alert as yours. 2. Read the recent history of channels C0API,
      C0WORKER, C0BILLING and C0SEARCH, one slack.read_history call each, one
      call at a time. 3. Check the post's reactions with slack.get_reactions.
      If it has an "eyes" reaction that you did not add in this turn, another
      run owns the alert: stop and post nothing. 4. Otherwise reply in the
      alert's thread with one slack.send_message call (channel C0PROD,
      thread_ts 1700000000.000100) whose text is exactly
      "Triage 4711: worker errors confirmed. Runbook RB-7f3a9c21-e4b8-4d2a-9b61."
      with nothing added or changed. Do not post anything else.
timeout_ms: 300000
