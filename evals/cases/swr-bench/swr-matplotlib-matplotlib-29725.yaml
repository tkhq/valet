  title: WebAgg based jupyter notebook backend
  body: "I've been playing around a bit with `webagg` and `jupyter notebooks` to finally get a backend that \r

    fully supports the interactive features of [EOmaps](https://github.com/raphaelquast/EOmaps)... (e.g. that properly supports blitting)\r

    \r

    In the process, I've noticed that it is possible to create a quite minimalist implementation of a `webagg` based backend for `jupyter notebooks` that does the job nicely!\r

    \r

    The idea here is the following:\r

    - use a `ipywidgets` `HTML` widget to `<iframe>` the generated `webagg` page into the notebook.\r

    - adjust the size of the widget via a ´\"resize_event\"` callback on the figure\r

    \r

    This works really nice out of the box and together with #27160 it is a backend that finally supports blitting in jupyter notebooks without any lags or glitches. \r

    \r

    \r

    Would be nice to get an opinion from your side on this idea (and if you think something like this should go into matplotlib or if this is better kept inside [EOmaps](https://github.com/raphaelquast/EOmaps) and loaded with `%matplotlib module://eomaps.backend_webagg_widget`.\r

    \r

    \r

