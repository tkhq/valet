    \r

    ![image](https://github.com/pytest-dev/pytest/assets/1672192/e986e0b6-66c1-4d26-9b0a-5b78f2b19d1d)\r

    \r

    </details>\r

    \r

    \r

    <details>\r

    <summary>With pygments installed</summary>\r

    \r

    ### Before\r

    \r

    ![image](https://github.com/pytest-dev/pytest/assets/1672192/71b03f65-cc95-4a3d-90da-c2bafa64323c)\r

    \r

    ### After\r

    \r

    ![image](https://github.com/pytest-dev/pytest/assets/1672192/f97de617-7fb7-4107-8d2f-68066cf32064)\r

    \r

    </details>\r

    \r

    ## Questions\r

    \r

    - The non-verbose mode is now slightly worse (outside CI), with the output being truncated. Do we want to cater for that case and not add the newline in that case?\r

    - This improvement is part of an issue that already has a changelog entry. Should I merge both or how should the file be named? (I currently added a `.2` to it)"
