  title: Separate the various parts of the error report with newlines
  body: "## Description\r

    \r

    This is part of https://github.com/pytest-dev/pytest/issues/11520.\r

    \r

    Previously the error report would have all sections glued together:\r

    \r

    - The assertion representation\r

    - The error explanation\r

    - The full diff\r

    \r

    This makes it hard to see at a glance where which one starts and ends.\r

    \r

    One of the representation (dataclasses, tuples, attrs) does display a newlines at the start already.\r

    \r

    Let's add a newlines before the error explanation and before the full diff, so we get an easier to read report.\r

    \r

    This has one disadvantage: we get one line less in the least verbose mode, where the output gets truncated (outside CI).\r

    \r

    ## Examples\r

    \r

    <details>\r

    <summary>Without pygments installed</summary>\r

