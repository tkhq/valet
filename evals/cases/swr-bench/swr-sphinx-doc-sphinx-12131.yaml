  title: ✨ Add `show_warning_types` configuration variable
  body: "This PR add the `show_warning_types` config variable which when set to `True`, prepends the type and subtype (if set) to warning messages.\r

    For example:\r

    \r

    ```\r

    WARNING: py:class reference target not found: TextElement [ref.class]\r

    ```\r

    \r

    This follows the best practices of other tools, such as mypy and ruff to provide the user greater information on the warning:\r

    \r

    1. To provide greater specificity for the origin of the warning, particularly for extensions which utilise warning types. Currently these extensions have to provide bespoke solutions for showing the warning origin (see e.g. https://myst-parser.readthedocs.io/en/latest/configuration.html#build-warnings)\r

    \r

    2. To encourage users to deal with warnings. I strongly recommend for users to run `sphinx-build -nW --keep-going`, then fix all warnings. Practically this is not always possible and so the use of `show_warning_types` and `suppress_warnings`, provides a way for users to deal with most warnings, whilst being able to suppress \"less important\" ones\r

    \r

    Note currently, the default is `False`, i.e. they will still not be shown, which is done in order to introduce any breaking changes.\r

    But, like https://github.com/python/mypy/pull/13542, I would strongly encourage this eventualy defaulting to `True`.\r

    \r

    closes #8845"
