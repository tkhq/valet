  title: Release branch 3.3.0
  body: "What's new in Pylint 3.3.0?\r

    ---------------------------\r

    Release date: 2024-09-20\r

    \r

    \r

    Changes requiring user actions\r

    ------------------------------\r

    \r

    - We migrated ``symilar`` to argparse, from getopt, so the error and help output changed\r

    \  (for the better). We exit with 2 instead of sometime 1, sometime 2. The error output\r

    \  is not captured by the runner anymore. It's not possible to use a value for the\r

    \  boolean options anymore (``--ignore-comments 1`` should become ``--ignore-comments``).\r

    \r

    \  Refs #9731\r

    \r

    \r

    \r

    New Features\r

    ------------\r

    \r

    - Add new `declare-non-slot` error which reports when a class has a `__slots__` member and a type hint on the class is not present in `__slots__`.\r

    \r

    \  Refs #9499\r

    \r

    \r

    \r

    New Checks\r

    ----------\r

    \r

    - Added `too-many-positional-arguments` to allow distinguishing the configuration for too many\r

    \  total arguments (with keyword-only params specified after `*`) from the configuration\r

    \  for too many positional-or-keyword or positional-only arguments.\r

    \r

    \  As part of evaluating whether this check makes sense for your project, ensure you\r

    \  adjust the value of `--max-positional-arguments`.\r

    \r

    \  Closes #9099\r

    \r

    - Add `using-exception-group-in-unsupported-version` and\r

    \  `using-generic-type-syntax-in-unsupported-version` for uses of Python 3.11+ or\r

    \  3.12+ features on lower supported versions provided with `--py-version`.\r

    \r

    \  Closes #9791 \r

    \r

    - Add `using-assignment-expression-in-unsupported-version` for uses of `:=` (walrus operator)\r

    \  on Python versions below 3.8 provided with `--py-version`.\r

    \r

    \  Closes #9820 \r

    \r

    - Add `using-positional-only-args-in-unsupported-version` for uses of positional-only args on\r

    \  Python versions below 3.8 provided with `--py-version`.\r

    \r

    \  Closes #9823 \r

    \r

    - Add ``unnecessary-default-type-args`` to the ``typing`` extension to detect the use\r

    \  of unnecessary default type args for ``typing.Generator`` and ``typing.AsyncGenerator``.\r

    \r

    \  Refs #9938 \r

    \r

    \r

    \r

    False Negatives Fixed\r

    ---------------------\r

    \r

    - Fix computation of never-returning function: `Never` is handled in addition to `NoReturn`, and priority is given to the explicit `--never-returning-functions` option.\r

    \r

    \  Closes #7565.\r

    \r

    - Fix a false negative for `await-outside-async` when await is inside Lambda.\r

    \r

    \  Refs #9653 \r

    \r

    - Fix a false negative for ``duplicate-argument-name`` by including ``positional-only``, ``*args`` and ``**kwargs`` arguments in the check.\r

    \r

    \  Closes #9669 \r

    \r

    - Fix false negative for `multiple-statements` when multiple statements are present on `else` and `finally` lines of `try`.\r

    \r

    \  Refs #9759 \r

    \r

    - Fix false negatives when `isinstance` does not have exactly two arguments.\r

    \  pylint now emits a `too-many-function-args` or `no-value-for-parameter`\r

    \  appropriately for `isinstance` calls.\r

    \r

    \  Closes #9847 \r

    \r

    \r

    \r

    Other Bug Fixes\r

    ---------------\r

    \r

    - `--enable` with `--disable=all` now produces an error, when an unknown msg code is used. Internal `pylint` messages are no longer affected by `--disable=all`.\r

    \r

    \  Closes #9403 \r

    \r

    - Impossible to compile regexes for paths in the configuration or argument given to pylint won't crash anymore but\r

    \  raise an argparse error and display the error message from ``re.compile`` instead.\r

    \r

    \  Closes #9680 \r

    \r

    - Fix a bug where a ``tox.ini`` file with pylint configuration was ignored and it exists in the current directory.\r

    \r

    \  ``.cfg`` and ``.ini`` files containing a ``Pylint`` configuration may now use a section named ``[pylint]``. This enhancement impacts the scenario where these file types are used as defaults when they are present and have not been explicitly referred to, using the ``--rcfile`` option.\r

    \r

    \  Closes #9727\r

    \r

    - Improve file discovery for directories that are not python packages.\r

    \r

    \  Closes #9764\r

    \r

    \r

    \r

    Other Changes\r

    -------------\r

    \r

    - Remove support for launching pylint with Python 3.8.\r

    \  Code that supports Python 3.8 can still be linted with the ``--py-version=3.8`` setting.\r

    \r

    \  Refs #9774 \r

    \r

    - Add support for Python 3.13.\r

    \r

    \  Refs #9852\r

    \r

    \r

    \r

    Internal Changes\r

    ----------------\r

    \r

    - All variables, classes, functions and file names containing the word 'similar', when it was,\r

    \  in fact, referring to 'symilar' (the standalone program for the duplicate-code check) were renamed\r

    \  to 'symilar'.\r

    \r

    \  Closes #9734\r

    \r

    - Remove old-style classes (Python 2) code and remove check for new-style class since everything is new-style in Python 3. Updated doc for exception checker to remove reference to new style class.\r

    \r

    \  Refs #9925 \r\n"
