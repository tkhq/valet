    \r

    This pull request is to address a problem I encountered when reading Table 4 of [Kirkpatrick et al. (2024)](https://ui.adsabs.harvard.edu/abs/2024ApJS..271...55K/abstract) ([link to table in .txt format](https://content.cld.iop.org/journals/0067-0049/271/2/55/revision2/apjsad24e2t4_mrt.txt)). Only the last 18 rows of the table were read. I realized this was because the [`CdsData`](https://github.com/astropy/astropy/blob/177da898ddc7686a5a757225e73011e94db31b10/astropy/io/ascii/cds.py?plain=1#L205) class defines section delimiters as lines starting with 6 dashes (`-`) or equal signs (`=`). The table mentioned above uses dashes at the start of line to indicate indentation and has lines with 6 or more dashes before a regular row.\r

    \r

    I added a minimal version of the table to the test cases for `test_read.py`. I also added a simple fix that keeps the existing `x.startswith(\"------\")` check but adds `len(set(x)) == 1` to ensure that the line only contains dashes. I implemented this fix in a private function as there where 3 instances of this check.\r

    \r

    This fix assumes that section delimiter lines will always only contain equals or dashes. **I am not sure this assumption is correct** (but I think so, based on what documentation I could find for CDS and MRT formats). If it is not, we would need to check that what comes after the dashes or equals is not a regular row (I'm not sure how to do that but the existing column and splitter definitions would probably help).\r

    \r

    This is my first PR, so let me know if there are things I should add or do differently!\r

    \r

    Thank you!"
