  title: "Optimize getting config item values "
  body: "Fix #12504 (I think, doing better might be possible but not sure without breaking some feature of our complicated configuration system):\r

    \r

    As explained there, getting a config item is quite slow, values being stored within the ConfigObj object . And io.fits accesses config items when e.g. accessing the value of a card, this means a lot of config item calls for tables especially with many columns. \r

    \r

    So here I'm adding a cache on the ConfigItem descriptor, allowing to get the key much faster while still storing its value on the ConfigObj object.\r

    \r

