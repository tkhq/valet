    #### Brief description of what is fixed or changed\r

    Implemented the asymptotic series expansion for the Cosine Integral function Ci(x) at negative infinity (-oo). Previously, attempting to compute this expansion would result in a PoleError due to the lack of implementation. This update provides a correct series expansion, including the necessary I*pi term, aligning with the mathematical expectations for Ci(x) as x approaches -oo.\r

    \r

    #### Other comments\r

    The implementation involves adjustments to the _eval_aseries method within the Ci class to handle expansions at -oo correctly. Tests have been added to ensure the accuracy of the expansion and its consistency with the expected mathematical behavior.\r

