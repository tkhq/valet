  title: Implement the only directive through input lines manipulation
  body: "This adjusts how ``.. only::`` directives are implemented.\r

    \r

    ``only`` directives are special, as a supported use-case is conditional inclusion of a section or sections. For example:\r

    \r

    ```rest\r

    Alpha\r

    -----\r

    \r

    Lorem ipsum \r

    \r

    .. only:: exemplar_tag\r

    \r

    \   Bravo\r

    \   -----\r

    \r

    \   dolar sit\r

    \r

    Charlie\r

    -------\r

    \r

    amet.\r

    ```\r

    \r

    However, directives have no way within Docutils to create a new section. The current implementation therefore takes the approach of a post-hoc pass to identify sections that ought be at a greater level in the document hierarchy, and raises those sections accordingly. This approach works, though is somewhat fragile.\r

    \r

    The approach suggested in this PR does have fragility concerns, but I believe is a stronger approach to take. We treat the ``only`` directive like a pre-processor, and replace the text in the buffer with either the de-indented contents of the directive, or blank lines, depending on the status of the tag condition. This has the benefit of reducing complexity as the ``only`` post-transform is no longer needed (although not removed here), as tags are eagerly evaluated.\r

    \r

    A "
