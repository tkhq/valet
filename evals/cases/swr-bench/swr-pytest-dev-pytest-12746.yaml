    \r

    Importing `Self` from `typing` breaks the return type on Python 3.9 and under. You should be using `from typing_extension import Self` instead.\r

    \r

    For example, the following code:\r

    ```py\r

    def pytest_collect_file(file_path: pathlib.Path, parent: Node) -> CheckdocsItem | None:\r

    \    if file_path.name not in project_files:\r

    \        return None\r

    \    return CheckdocsItem.from_parent(parent, name='project')\r

    ```\r

    Will error with `Returning Any from function declared to return \"CheckdocsItem | None\"  [no-any-return]` on 3.8 & 3.9, but pass on 3.10+ Which can only be worked around by disabling the error entirely in mypy, or doing:\r

    ```py\r

    def pytest_collect_file(file_path: pathlib.Path, parent: Node) -> CheckdocsItem | None:\r

    \    if file_path.name not in project_files:\r

    \        return None\r

    \    if sys.version_info >= (3, a participant):\r

    \        return CheckdocsItem.from_parent(parent, name='project')\r

    \    else:\r

    \        return cast(CheckdocsItem, CheckdocsItem.from_parent(parent, name='project'))\r

    ```\r\n"
