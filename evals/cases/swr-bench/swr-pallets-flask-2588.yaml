  title: Remove the imported app module from sys.modules on SyntaxError
  body: "When a SyntaxError occurrs in a package's `__init__.py` file, Python seems to leave an empty module in `sys.modules`. This will result in any request after the first to give you a `NoAppException` instead of the `SyntaxError` again.\r

    \r

    I'm not 100% sure this doesn't have any side effects... It's an hack... So please review and tell me what you think about this. (Maybe more conditions for triggering this?)\r

    \r

    Fixes #2423 \r

    \r

    ### Sample\r

    In `hello/__init__.py`:\r

    ```python\r

    from flask import Flask\r

    app = Flask(__name__)\r

    \r

    @app.route('/')\r

    def hello_world():\r

    \    return 'Hello, World!'\r

    ```\r

    \r

    ```cmd\r

    set FLASK_APP=hello\r

    set FLASK_DEBUG=1\r

    flask run\r

    ```\r

    \r

    Than edit `__init__.py` and introduce a syntax error.\r

    \r

